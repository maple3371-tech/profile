<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARACTER ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Galmuri11:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bezel:#2b2d3a;
  --bezel-dark:#1a1b24;
  --bezel-light:#3d4054;
  --screen:#0e1015;
  --screen-glow:#16323a;
  --ink:#eaf4ee;
  --ink-dim:#9fb4a8;
  --accent:#9ff0bf;
  --accent-2:#ffd95e;
  --danger:#ff7b7b;
  --line:#46505f;
  --pad:#252838;
  --theme:#8be9b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Galmuri11','DotGothic16',monospace;
  background:
    radial-gradient(circle at 30% 10%, #23262f 0%, #14151c 60%, #0c0d12 100%);
  color:var(--ink);
  min-height:100vh;
  padding:24px 14px 60px;
  display:flex;justify-content:center;
  image-rendering:pixelated;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ===== 게임기 본체 ===== */
.console{
  width:100%;max-width:960px;
  background:linear-gradient(180deg,var(--bezel-light),var(--bezel) 18%,var(--bezel-dark));
  border-radius:22px 22px 30px 30px;
  padding:20px 20px 26px;
  box-shadow:
    0 0 0 3px #0c0d12,
    0 18px 0 -2px #0c0d12,
    0 26px 60px rgba(0,0,0,.7),
    inset 0 2px 0 rgba(255,255,255,.08),
    inset 0 -6px 18px rgba(0,0,0,.6);
  position:relative;
}
.brand-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 8px 14px;
}
.brand{
  font-family:'Press Start 2P',monospace;
  font-size:11px;letter-spacing:1px;color:var(--accent);
  text-shadow:1px 1px 0 #0c0d12;
}
.brand .sub{color:var(--ink-dim);font-size:8px;display:block;margin-top:6px}
.power{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--ink-dim)}
.led{width:10px;height:10px;border-radius:50%;background:var(--danger);
  box-shadow:0 0 8px var(--danger),inset 0 0 3px #fff5;animation:blink 3s infinite}
@keyframes blink{0%,92%,100%{opacity:1}94%{opacity:.3}}

/* ===== 스크린 ===== */
.screen-wrap{
  background:var(--bezel-dark);
  border-radius:12px;
  padding:14px;
  box-shadow:inset 0 3px 12px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05);
}
.screen{
  background:
    linear-gradient(180deg,var(--screen-glow) 0%, var(--screen) 12%);
  border:2px solid #05070a;
  border-radius:6px;
  min-height:560px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 40px rgba(0,0,0,.9),inset 0 0 80px var(--screen-glow);
}
.screen::after{ /* scanlines */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);
  mix-blend-mode:multiply;
}
.screen-inner{position:relative;z-index:2;padding:16px 16px 24px;height:100%}

/* ===== 탭 ===== */
.tabs{
  display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;
}
.tab{
  flex:1 1 auto;min-width:66px;
  background:var(--pad);
  color:var(--ink-dim);
  border:2px solid #05070a;
  border-bottom-width:4px;
  border-radius:6px;
  padding:9px 5px;
  font-size:11px;font-weight:700;
  letter-spacing:.3px;
  transition:transform .05s,background .15s,color .15s;
  position:relative;
  text-align:center;
  line-height:1.3;
}
.tab .tnum{display:block;font-family:'Press Start 2P',monospace;font-size:9px;margin-bottom:5px}
.tab:hover{color:var(--ink)}
.tab.active{
  color:#0c0d12;
  background:var(--theme);
  border-bottom-width:2px;
  transform:translateY(2px);
  text-shadow:none;
}
.tab:active{transform:translateY(2px)}

/* ===== 페이지 ===== */
.page{display:none;animation:fadein .25s}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

.page-head{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  border-bottom:2px dashed var(--line);padding-bottom:10px;
}
.page-head h2{
  font-family:'Press Start 2P',monospace;font-size:13px;color:var(--theme);
  text-shadow:2px 2px 0 #05070a;
}
.page-head .blink{margin-left:auto;color:var(--ink-dim);font-size:10px;animation:blink 1.2s steps(2) infinite}

/* ===== 공통 입력 ===== */
label.fld{display:block;margin-bottom:12px;font-size:12px;color:var(--ink-dim)}
label.fld span{display:block;margin-bottom:5px;color:var(--accent);letter-spacing:.5px;font-size:11px;font-weight:700}
.inp,textarea.inp,select.inp{
  width:100%;background:#0a0e13;color:var(--ink);
  border:2px solid var(--line);border-radius:5px;
  padding:9px 10px;font-size:13px;line-height:1.5;outline:none;
}
.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--theme);box-shadow:0 0 0 2px rgba(159,240,191,.22)}
.inp::placeholder,textarea.inp::placeholder{color:#5d6b62}
textarea.inp{resize:vertical;min-height:64px;line-height:1.6}

/* ===== 버튼 ===== */
.btn{
  background:var(--pad);color:var(--accent);
  border:2px solid #05070a;border-bottom-width:4px;border-radius:6px;
  padding:9px 15px;font-size:12px;font-weight:700;letter-spacing:.5px;
}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--theme);color:#05070a}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:11px}

/* ===== 서사 페이지 ===== */
.scenario{
  background:rgba(0,0,0,.32);
  border:2px solid var(--line);
  border-left:6px solid var(--theme);
  border-radius:10px;padding:16px;margin-bottom:18px;
  position:relative;
}
.scenario-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:nowrap}
.cover-box{
  width:150px;height:200px;flex-shrink:0;
  background:#0a0e13;border:2px solid var(--line);border-radius:8px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;
}
.cover-box img{width:100%;height:100%;object-fit:cover}
.cover-box .ph{font-size:10px;color:var(--ink-dim);text-align:center;padding:8px;line-height:1.6}
.cover-box:hover{border-color:var(--theme)}
.cover-box:hover .ph{color:var(--accent)}
.scenario-fields{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:9px}
.stars{display:flex!important;flex-direction:row;gap:5px;font-size:24px;cursor:pointer;user-select:none;line-height:1;margin-top:2px}
.stars .star{display:inline!important;margin:0;color:#46505f;transition:color .1s,transform .1s}
.stars .star.on{color:var(--accent-2);text-shadow:0 0 7px rgba(255,217,94,.65)}
.stars .star:hover{transform:scale(1.15)}
.meta-row{display:flex;gap:10px;flex-wrap:wrap}
.meta-row .fld{flex:1 1 90px;margin-bottom:0}
.scenario-body{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.del-x{
  position:absolute;top:10px;right:10px;
  background:#05070a;color:var(--danger);border:1px solid var(--danger);
  border-radius:5px;width:26px;height:26px;font-size:13px;line-height:1;z-index:3;
}
.del-x:hover{background:var(--danger);color:#05070a}
.edit-actions{margin-top:14px;display:flex;justify-content:flex-end}

/* ----- 시나리오 보기 모드(작품 소개) ----- */
.scenario.view{cursor:pointer;transition:border-color .15s,transform .08s}
.scenario.view:hover{border-color:var(--theme)}
.scenario.view:hover .sv-hint{opacity:1}
.cover-view{
  width:150px;height:200px;flex-shrink:0;border-radius:8px;overflow:hidden;
  background:#0a0e13;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.cover-view img{width:100%;height:100%;object-fit:cover}
.cover-view .ph{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ink-dim);letter-spacing:1px}
.sv-head{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px;padding-top:2px}
.sv-title{
  font-size:25px;font-weight:700;line-height:1.25;color:var(--ink);
  letter-spacing:.3px;word-break:keep-all;
}
.sv-untitled{color:var(--ink-dim);font-weight:400}
.sv-diff .stars-view{display:flex;gap:4px;font-size:19px;line-height:1}
.stars-view .star{color:#46505f}
.stars-view .star.on{color:var(--accent-2);text-shadow:0 0 7px rgba(255,217,94,.6)}
.sv-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink)}
.sv-meta .m-item b{color:var(--accent);font-weight:700;margin-right:5px;font-size:12px}
.sv-meta .sv-dim,.sv-dim{color:var(--ink-dim);font-size:12px}
.sv-body{
  margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);
  display:flex;flex-direction:column;gap:14px;
}
.sv-block .sv-label{
  font-family:'Press Start 2P',monospace;font-size:10px;color:var(--theme);
  margin-bottom:7px;text-shadow:1px 1px 0 #05070a;
}
.sv-block p{font-size:14px;line-height:1.75;color:var(--ink);word-break:break-word}
.sv-hint{
  position:absolute;bottom:10px;right:14px;font-size:10px;color:var(--ink-dim);
  opacity:0;transition:opacity .15s;letter-spacing:.5px;
}

/* ===== 인물 페이지 ===== */
.profile-top{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.avatar-box{
  width:150px;height:180px;flex-shrink:0;
  background:#070a0e;border:3px solid var(--theme);border-radius:8px;
  overflow:hidden;cursor:pointer;position:relative;
  box-shadow:0 0 14px rgba(139,233,176,.25);
  display:flex;align-items:center;justify-content:center;
}
.avatar-box img{width:100%;height:100%;object-fit:cover}
.avatar-box .ph{font-size:10px;color:var(--ink-dim);text-align:center;padding:8px;line-height:1.6}
.avatar-box:hover .ph{color:var(--theme)}
.profile-fields{flex:1 1 260px;min-width:240px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profile-fields .full{grid-column:1/-1}

/* ===== 프로필 보기(생활기록부) ===== */
.profile-view{
  display:flex;gap:18px;align-items:stretch;margin-bottom:18px;
  cursor:pointer;flex-wrap:nowrap;
}
.pv-photo{
  width:160px;flex-shrink:0;border-radius:10px;overflow:hidden;position:relative;
  background:#0a0e13;border:3px solid var(--theme);
  box-shadow:0 0 16px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;min-height:210px;
}
.pv-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pv-photo .ph{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--ink-dim);text-align:center;line-height:1.8;letter-spacing:1px}
.pv-badge{
  position:absolute;top:0;left:0;background:var(--theme);color:#05070a;
  font-family:'Press Start 2P',monospace;font-size:9px;padding:5px 8px;
  border-bottom-right-radius:8px;letter-spacing:.5px;
}
.rec-card{
  flex:1 1 0;min-width:0;position:relative;
  background:
    linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.2)),
    rgba(0,0,0,.28);
  border:2px solid var(--line);border-radius:10px;
  padding:16px 18px 30px;display:flex;flex-direction:column;
}
.rec-name{
  font-size:22px;font-weight:700;color:var(--theme);letter-spacing:1px;
  padding-bottom:12px;margin-bottom:12px;
  border-bottom:2px solid var(--theme);
  text-shadow:1px 1px 0 #05070a;
}
.rec-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.rec-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.rec-row:last-child{border-bottom:none}
.rec-label{
  flex:0 0 92px;background:rgba(255,255,255,.04);
  padding:9px 12px;font-size:12px;font-weight:700;color:var(--accent);
  letter-spacing:.5px;display:flex;align-items:center;
  border-right:1px solid var(--line);
}
.rec-val{flex:1 1 0;padding:9px 12px;font-size:14px;color:var(--ink);display:flex;align-items:center;word-break:break-word}
.rec-empty{color:var(--ink-dim)}
.rec-items{margin-top:12px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.rec-items-label{
  background:rgba(255,255,255,.04);padding:8px 12px;font-size:12px;font-weight:700;
  color:var(--accent);letter-spacing:.5px;border-bottom:1px solid var(--line);
}
.rec-items-body{padding:10px 12px;font-size:13px;line-height:1.7;color:var(--ink);min-height:38px}
.profile-view:hover .rec-card{border-color:var(--theme)}
.profile-view:hover .sv-hint{opacity:1}

/* 능력치 */
.stats-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px;
}
.stat-cell{
  background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:7px;
  padding:9px 12px;display:flex;align-items:center;gap:8px;
}
.stat-name{flex:1;font-size:13px;color:var(--accent);letter-spacing:.3px;cursor:default;font-weight:700}
.stat-name.editable{cursor:pointer;border-bottom:1px dotted var(--ink-dim)}
.stat-name.editable:hover{color:var(--accent-2)}
.stat-val{
  width:58px;background:#0a0e13;color:var(--ink);
  border:2px solid var(--line);border-radius:5px;
  padding:6px 4px;font-size:14px;text-align:center;font-weight:700;
}
.stat-val:focus{border-color:var(--theme);outline:none}
.stat-name-edit{
  flex:1;background:#0a0e13;color:var(--accent-2);
  border:2px solid var(--accent-2);border-radius:5px;
  padding:4px 6px;font-size:13px;font-weight:700;
}

/* 섹션 헤더 */
.subhead{
  font-family:'Press Start 2P',monospace;font-size:12px;color:var(--theme);
  margin:24px 0 12px;display:flex;align-items:center;gap:8px;
  text-shadow:1px 1px 0 #05070a;
}
.subhead::before{content:"▸";color:var(--accent-2)}
.subhead .count{font-family:'Galmuri11';font-size:11px;color:var(--ink-dim);margin-left:auto;display:flex;align-items:center}

/* 특이사항 */
.note-item{
  background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:7px;
  padding:12px;margin-bottom:11px;position:relative;
}
.note-item .note-title{
  width:calc(100% - 36px);background:#0a0e13;color:var(--accent-2);
  border:2px solid var(--line);border-radius:5px;padding:7px 10px;
  font-size:13px;margin-bottom:9px;font-weight:700;
}
.note-item textarea{min-height:60px}
.note-item.view{cursor:pointer;transition:border-color .15s}
.note-item.view:hover{border-color:var(--theme)}
.note-item.view:hover .sv-hint{opacity:1}
.note-item.view .nv-title{
  font-size:15px;font-weight:700;color:var(--accent-2);margin-bottom:7px;
  letter-spacing:.3px;word-break:keep-all;
}
.note-item.view .nv-body{
  font-size:13px;line-height:1.7;color:var(--ink);word-break:break-word;
}

/* 갤러리 캐러셀 */
.gallery-wrap{position:relative;margin-bottom:12px}
.gstage{
  position:relative;width:100%;height:360px;
  background:repeating-linear-gradient(45deg,#0a0e13 0 14px,#0c1117 14px 28px);
  border:2px solid var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.gstage img{
  max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;display:block;cursor:zoom-in;
  image-rendering:auto;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));
}
.gstage .gcounter{
  position:absolute;top:10px;left:12px;z-index:4;
  background:#05070acc;color:var(--accent);font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:5px;letter-spacing:.5px;
}
.gstage .gdel{
  position:absolute;top:10px;right:12px;z-index:4;
  background:#05070acc;color:var(--danger);border:1px solid var(--danger);
  border-radius:5px;width:28px;height:28px;font-size:13px;
}
.gnav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:6;
  background:var(--theme);color:#05070a;border:2px solid #05070a;
  width:38px;height:54px;border-radius:8px;font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center;opacity:.9;
}
.gnav:hover{opacity:1}
.gnav:disabled{opacity:.25;cursor:default}
.gnav.left{left:8px}.gnav.right{right:8px}

/* 썸네일 정렬 스트립 */
.gstrip{
  display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;margin-top:10px;
  scrollbar-width:thin;scrollbar-color:var(--theme) #0a0e13;
}
.gstrip::-webkit-scrollbar{height:8px}
.gstrip::-webkit-scrollbar-track{background:#0a0e13;border-radius:6px}
.gstrip::-webkit-scrollbar-thumb{background:var(--theme);border-radius:6px}
.gtm{
  flex:0 0 auto;width:62px;height:62px;border-radius:6px;overflow:hidden;
  border:2px solid var(--line);cursor:grab;position:relative;background:#0a0e13;
}
.gtm img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.gtm.current{border-color:var(--theme);box-shadow:0 0 0 2px var(--theme)}
.gtm.dragging{opacity:.4;border-color:var(--accent-2)}
.gtm.over{border-color:var(--accent-2);box-shadow:0 0 0 2px var(--accent-2)}
.gtm .gtm-num{position:absolute;bottom:2px;right:3px;font-size:9px;color:#fff;
  background:#05070acc;padding:0 4px;border-radius:3px}

.gallery-empty{
  color:var(--ink-dim);font-size:12px;text-align:center;padding:40px 20px;
  border:2px dashed var(--line);border-radius:10px;line-height:1.7;
}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.hint{font-size:11px;color:var(--ink-dim);line-height:1.7}

/* 라이트박스 */
.lightbox{
  position:fixed;inset:0;background:rgba(3,4,7,.92);z-index:999;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.lightbox.show{display:flex}
.lightbox img{max-width:92%;max-height:88%;border:3px solid var(--theme);border-radius:8px;image-rendering:auto}
.lightbox .lbx{position:absolute;top:18px;right:22px;background:var(--theme);color:#05070a;
  border:none;width:40px;height:40px;border-radius:8px;font-size:18px;font-weight:700}

/* 하단 컨트롤 패드(장식+기능) */
.controls{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:18px;padding:0 8px;
}
.dpad{position:relative;width:54px;height:54px}
.dpad i{position:absolute;background:var(--pad);border:2px solid #05070a}
.dpad .v{left:19px;top:2px;width:14px;height:50px;border-radius:4px}
.dpad .h{top:19px;left:2px;width:50px;height:14px;border-radius:4px}
.abtns{display:flex;gap:10px;align-items:center}
.rbtn{width:34px;height:34px;border-radius:50%;background:var(--pad);
  border:2px solid #05070a;border-bottom-width:5px;color:var(--accent);font-size:11px;font-weight:700}
.save-status{font-size:9px;color:var(--ink-dim);text-align:center;flex:1}
.save-status b{color:var(--accent)}

.hidden-file{display:none}

@media(max-width:560px){
  .profile-fields{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr}
  .brand{font-size:9px}
  .page-head h2{font-size:10px}
  .scenario-top{flex-wrap:wrap}
  .cover-box{width:100%;height:220px}
  .scenario-fields{flex-basis:100%}
  .gstage{height:280px}
  .profile-view{flex-wrap:wrap}
  .pv-photo{width:100%;min-height:240px}
  .rec-card{flex-basis:100%}
}
</style>
</head>
<body>
<div class="console">
  <div class="brand-bar">
    <div class="brand">CHARACTER ARCHIVE<span class="sub">TRPG DATABASE SYSTEM v1.0</span></div>
    <div class="power"><span class="led"></span>POWER</div>
  </div>

  <div class="screen-wrap">
    <div class="screen">
      <div class="screen-inner">

        <div class="tabs" id="tabs">

<script>
/* =========================================================
   데이터 모델 & IndexedDB 영속성
   ========================================================= */
const DB_NAME='char_archive_db', STORE='state', KEY='main';
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{const d=e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);};
    r.onsuccess=e=>{db=e.target.result;res(db);};
    r.onerror=e=>rej(e);
  });
}
function dbGet(key){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly').objectStore(STORE).get(key);
    tx.onsuccess=()=>res(tx.result);tx.onerror=()=>rej(tx.error);
  });
}
function dbSet(key,val){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite').objectStore(STORE).put(val,key);
    tx.onsuccess=()=>res();tx.onerror=()=>rej(tx.error);
  });
}

const CHARS=[
  {id:'c0',name:'安井 空',  color:'#EC407A'},
  {id:'c1',name:'縁下 力',  color:'#F05E23'},
  {id:'c2',name:'二口 堅治',color:'#507842'},
  {id:'c3',name:'白布 賢二郎',color:'#790963'},
  {id:'c4',name:'矢巾 秀',  color:'#A6DAF4'},
  {id:'c5',name:'照島 遊児',color:'#E5B409'},
];
const BASE_STATS=['근력','지능','건강','이성','외모','민첩','행운','전투','특별능력치','체력'];
const PROFILE_FIELDS=[
  {k:'height',label:'키'},{k:'position',label:'포지션'},
  {k:'school',label:'학교'},{k:'birthday',label:'생일'},
];

// 기본 상태
function blankChar(){
  return {
    avatar:null,
    profile:{height:'',position:'',school:'',birthday:'',items:''},
    statNames:[...BASE_STATS],
    statVals:Array(10).fill(''),
    notes:[],     // {title, body}
    gallery:[],   // {id, img}
  };
}
let STATE={
  scenarios:[],   // {id,title,cover,difficulty,genre,players,charList,overview,summary}
  chars:Object.fromEntries(CHARS.map(c=>[c.id,blankChar()]))
};

/* ---- 저장 (디바운스) ---- */
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    await dbSet(KEY,STATE);
    const t=new Date();
    document.getElementById('saveTime').textContent=t.toLocaleTimeString('ko-KR',{hour12:false});
  },350);
}

/* =========================================================
   이미지 업로드 헬퍼 (파일 → dataURL, 다운스케일)
   ========================================================= */
function fileToDataURL(file,maxDim=1280,quality=.82){
  return new Promise((res)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width:w,height:h}=img;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
          else{w=Math.round(w*maxDim/h);h=maxDim;}
        }
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        try{res(cv.toDataURL('image/jpeg',quality));}
        catch(e){res(reader.result);}
      };
      img.onerror=()=>res(reader.result);
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// 공용 파일 인풋: 콜백 등록 방식
const fileInput=document.getElementById('fileInput');
let fileCb=null;
function pickFile(multiple,cb){
  fileCb=cb; fileInput.multiple=!!multiple; fileInput.value='';
  fileInput.click();
}
fileInput.addEventListener('change',async e=>{
  const files=[...e.target.files]; if(!files.length||!fileCb)return;
  const urls=[];
  for(const f of files){urls.push(await fileToDataURL(f));}
  fileCb(urls); fileCb=null;
});

/* =========================================================
   탭 전환
   ========================================================= */
function setTheme(color){document.documentElement.style.setProperty('--theme',color);}
document.getElementById('tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(!tab)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  tab.classList.add('active');
  const pg=tab.dataset.page;
  document.getElementById('page-'+pg).classList.add('active');
  if(pg==='story') setTheme('#8be9b0');
  else{const c=CHARS.find(x=>x.id===pg); if(c)setTheme(c.color);}
});

/* =========================================================
   서사(시나리오) 렌더링
   ========================================================= */
function newScenario(){
  return{id:'s'+Date.now()+Math.random().toString(36).slice(2,6),
    title:'',cover:null,difficulty:0,genre:'',players:'',charList:'',overview:'',summary:''};
}
const scenarioList=document.getElementById('scenarioList');
function renderScenarios(){
  scenarioList.innerHTML='';
  if(!STATE.scenarios.length){
    scenarioList.innerHTML='<div class="gallery-empty">아직 기록된 시나리오가 없습니다. 위 버튼으로 첫 시나리오를 추가하세요.</div>';
    return;
  }
  STATE.scenarios.forEach(s=>scenarioList.appendChild(scenarioEl(s)));
}
function scenarioEl(s){
  const el=document.createElement('div');el.className='scenario';
  if(s._editing){ renderScenarioEdit(el,s); }
  else { renderScenarioView(el,s); }
  return el;
}

/* ----- 보기 모드: 작품 소개 페이지 ----- */
function renderScenarioView(el,s){
  el.classList.add('view');
  const stars=`<span class="stars-view">${[1,2,3,4,5].map(i=>`<span class="star ${i<=s.difficulty?'on':''}">★</span>`).join('')}</span>`;
  const metaBits=[];
  if(s.genre) metaBits.push(`<span class="m-item"><b>장르</b> ${esc(s.genre)}</span>`);
  if(s.players) metaBits.push(`<span class="m-item"><b>인원</b> ${esc(s.players)}</span>`);
  if(s.charList) metaBits.push(`<span class="m-item"><b>참여</b> ${esc(s.charList)}</span>`);
  el.innerHTML=`
    <div class="scenario-top">
      <div class="cover-view">${s.cover?`<img src="${s.cover}">`:'<span class="ph">NO COVER</span>'}</div>
      <div class="sv-head">
        <h3 class="sv-title">${s.title?esc(s.title):'<span class="sv-untitled">제목 없음</span>'}</h3>
        <div class="sv-diff">${stars}</div>
        <div class="sv-meta">${metaBits.join('')||'<span class="sv-dim">세부 정보 없음</span>'}</div>
      </div>
    </div>
    ${(s.overview||s.summary)?`<div class="sv-body">
      ${s.overview?`<div class="sv-block"><div class="sv-label">개요</div><p>${esc(s.overview).replace(/\n/g,'<br>')}</p></div>`:''}
      ${s.summary?`<div class="sv-block"><div class="sv-label">서사 요약</div><p>${esc(s.summary).replace(/\n/g,'<br>')}</p></div>`:''}
    </div>`:''}
    <div class="sv-hint">더블클릭하여 수정</div>`;
  el.addEventListener('dblclick',e=>{
    if(e.target.closest('.cover-view') && s.cover){ openLightbox(s.cover); return; }
    s._editing=true; renderScenarios();
  });
}

/* ----- 편집 모드 ----- */
function renderScenarioEdit(el,s){
  el.classList.add('editing');
  el.innerHTML=`
    <button class="del-x" title="삭제">×</button>
    <div class="scenario-top">
      <div class="cover-box">${s.cover?`<img src="${s.cover}">`:'<span class="ph">시나리오<br>표지<br>(클릭 업로드)</span>'}</div>
      <div class="scenario-fields">
        <label class="fld"><span>시나리오 제목</span><input class="inp" data-f="title" value="${esc(s.title)}" placeholder="제목 입력"></label>
        <label class="fld"><span>난이도</span>
          <span class="stars" data-stars>${[1,2,3,4,5].map(i=>`<span class="star ${i<=s.difficulty?'on':''}" data-v="${i}">★</span>`).join('')}</span>
        </label>
        <div class="meta-row">
          <label class="fld"><span>장르</span><input class="inp" data-f="genre" value="${esc(s.genre)}" placeholder="호러 등"></label>
          <label class="fld"><span>인원</span><input class="inp" data-f="players" value="${esc(s.players)}" placeholder="4인 등"></label>
        </div>
        <label class="fld"><span>참여 캐릭터 목록</span><input class="inp" data-f="charList" value="${esc(s.charList)}" placeholder="安井 空, 縁下 力 ..."></label>
      </div>
    </div>
    <div class="scenario-body">
      <label class="fld"><span>개요</span><textarea class="inp" data-f="overview" placeholder="시나리오 개요">${esc(s.overview)}</textarea></label>
      <label class="fld"><span>서사 요약</span><textarea class="inp" data-f="summary" placeholder="서사 요약" style="min-height:110px">${esc(s.summary)}</textarea></label>
    </div>
    <div class="edit-actions"><button class="btn primary" data-done>✓ 완료</button></div>`;
  el.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('input',()=>{s[inp.dataset.f]=inp.value;scheduleSave();});
  });
  el.querySelector('[data-stars]').addEventListener('click',ev=>{
    const st=ev.target.closest('.star');if(!st)return;
    const v=+st.dataset.v; s.difficulty=(s.difficulty===v?v-1:v);
    el.querySelectorAll('[data-stars] .star').forEach((sp,i)=>sp.classList.toggle('on',i<s.difficulty));
    scheduleSave();
  });
  el.querySelector('.cover-box').addEventListener('click',()=>{
    pickFile(false,urls=>{s.cover=urls[0];renderScenarios();scheduleSave();});
  });
  el.querySelector('.cover-box').addEventListener('contextmenu',e=>{
    e.preventDefault(); if(s.cover&&confirm('표지를 삭제할까요?')){s.cover=null;renderScenarios();scheduleSave();}
  });
  el.querySelector('.del-x').addEventListener('click',()=>{
    if(confirm('이 시나리오를 삭제할까요?')){STATE.scenarios=STATE.scenarios.filter(x=>x.id!==s.id);renderScenarios();scheduleSave();}
  });
  el.querySelector('[data-done]').addEventListener('click',()=>{
    s._editing=false; renderScenarios(); scheduleSave();
  });
}
document.getElementById('addScenario').addEventListener('click',()=>{
  const sc=newScenario(); sc._editing=true;
  STATE.scenarios.push(sc);renderScenarios();scheduleSave();
  scenarioList.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'});
});

/* =========================================================
   인물 페이지 렌더링
   ========================================================= */
const charPagesWrap=document.getElementById('charPages');
function buildCharPages(){
  charPagesWrap.innerHTML='';
  CHARS.forEach(c=>{
    const page=document.createElement('div');
    page.className='page';page.id='page-'+c.id;
    page.innerHTML=`
      <div class="page-head"><h2>NO.${c.id.slice(1)} ${esc(c.name)}</h2><span class="blink">▌</span></div>
      <div data-profile></div>

      <div class="subhead">STATUS<span class="count">특별능력치는 이름을 더블클릭해 수정</span></div>
      <div class="stats-grid" data-stats></div>

      <div class="subhead">특이사항<span class="count"><button class="btn sm primary" data-addnote>+ 추가</button></span></div>
      <div data-notes></div>

      <div class="subhead">갤러리<span class="count"><button class="btn sm primary" data-addgal>+ 사진 추가(여러장)</button></span></div>
      <p class="hint" style="margin-bottom:8px">화살표로 한 장씩 넘기기 · 사진 클릭 시 크게 보기 · 아래 작은 썸네일을 드래그해 순서 변경</p>
      <div class="gallery-wrap">
        <div class="gstage" data-stage></div>
        <button class="gnav left" data-gl>‹</button>
        <button class="gnav right" data-gr>›</button>
      </div>
      <div class="gstrip" data-strip></div>`;
    charPagesWrap.appendChild(page);
    bindCharPage(page,c);
  });
}
function st(id){return STATE.chars[id];}

function bindCharPage(page,c){
  const data=st(c.id);

  renderProfile(page,c);
  renderStats(page,c);
  renderNotes(page,c);
  renderGallery(page,c);

  page.querySelector('[data-addnote]').addEventListener('click',()=>{
    data.notes.push({id:'n'+Date.now(),title:'',body:'',_editing:true});renderNotes(page,c);scheduleSave();
  });
  page.querySelector('[data-addgal]').addEventListener('click',()=>{
    pickFile(true,urls=>{
      const firstNew=data.gallery.length;
      urls.forEach(u=>data.gallery.push({id:'g'+Date.now()+Math.random().toString(36).slice(2,5),img:u}));
      galIndex[c.id]=firstNew; // 새로 추가한 첫 사진을 보여줌
      renderGallery(page,c);scheduleSave();
    });
  });
  page.querySelector('[data-gl]').addEventListener('click',()=>moveGallery(c.id,-1));
  page.querySelector('[data-gr]').addEventListener('click',()=>moveGallery(c.id,1));
}

/* ---- 프로필: 보기(생활기록부) / 편집 ---- */
const profileEditing={}; // charId -> bool
function renderProfile(page,c){
  if(profileEditing[c.id]) renderProfileEdit(page,c);
  else renderProfileView(page,c);
}
function renderProfileView(page,c){
  const data=st(c.id);const box=page.querySelector('[data-profile]');
  const p=data.profile;
  const row=(label,val)=>`<div class="rec-row"><span class="rec-label">${label}</span><span class="rec-val">${val?esc(val):'<span class="rec-empty">—</span>'}</span></div>`;
  box.innerHTML=`
    <div class="profile-view">
      <div class="pv-photo" data-pvphoto>
        ${data.avatar?`<img src="${data.avatar}">`:'<span class="ph">NO<br>PHOTO</span>'}
        <span class="pv-badge">NO.${c.id.slice(1)}</span>
      </div>
      <div class="rec-card">
        <div class="rec-name">${esc(c.name)}</div>
        <div class="rec-table">
          ${row('키',p.height)}
          ${row('포지션',p.position)}
          ${row('학교',p.school)}
          ${row('생일',p.birthday)}
        </div>
        <div class="rec-items">
          <div class="rec-items-label">소지품</div>
          <div class="rec-items-body">${p.items?esc(p.items).replace(/\n/g,'<br>'):'<span class="rec-empty">—</span>'}</div>
        </div>
        <div class="sv-hint">더블클릭하여 수정</div>
      </div>
    </div>`;
  box.querySelector('.profile-view').addEventListener('dblclick',e=>{
    if(e.target.closest('[data-pvphoto]') && data.avatar){openLightbox(data.avatar);return;}
    profileEditing[c.id]=true;renderProfile(page,c);
  });
}
function renderProfileEdit(page,c){
  const data=st(c.id);const box=page.querySelector('[data-profile]');
  box.innerHTML=`
    <div class="profile-top">
      <div class="avatar-box" data-avatar>${data.avatar?`<img src="${data.avatar}">`:'<span class="ph">프로필<br>사진<br><br>클릭하여<br>업로드</span>'}</div>
      <div class="profile-fields">
        <label class="fld"><span>이름</span><input class="inp" value="${esc(c.name)}" disabled style="opacity:.7"></label>
        <label class="fld"><span>키</span><input class="inp" data-p="height" placeholder="cm"></label>
        <label class="fld"><span>포지션</span><input class="inp" data-p="position" placeholder="포지션"></label>
        <label class="fld"><span>학교</span><input class="inp" data-p="school" placeholder="학교"></label>
        <label class="fld"><span>생일</span><input class="inp" data-p="birthday" placeholder="MM/DD"></label>
        <label class="fld full"><span>소지품</span><textarea class="inp" data-p="items" placeholder="소지품 목록"></textarea></label>
      </div>
    </div>
    <div class="edit-actions"><button class="btn primary" data-pdone>✓ 완료</button></div>`;
  const av=box.querySelector('[data-avatar]');
  av.addEventListener('click',()=>pickFile(false,urls=>{data.avatar=urls[0];renderProfileEdit(page,c);scheduleSave();}));
  av.addEventListener('contextmenu',e=>{e.preventDefault();if(data.avatar&&confirm('프로필 사진을 삭제할까요?')){data.avatar=null;renderProfileEdit(page,c);scheduleSave();}});
  box.querySelectorAll('[data-p]').forEach(inp=>{
    const k=inp.dataset.p;inp.value=data.profile[k]||'';
    inp.addEventListener('input',()=>{data.profile[k]=inp.value;scheduleSave();});
  });
  box.querySelector('[data-pdone]').addEventListener('click',()=>{profileEditing[c.id]=false;renderProfile(page,c);scheduleSave();});
}

/* ---- 능력치 ---- */
function renderStats(page,c){
  const data=st(c.id);const grid=page.querySelector('[data-stats]');grid.innerHTML='';
  data.statNames.forEach((nm,i)=>{
    const isSpecial=(i===8); // 특별능력치 슬롯만 이름 수정 가능
    const cell=document.createElement('div');cell.className='stat-cell';
    cell.innerHTML=`<span class="stat-name ${isSpecial?'editable':''}" title="${isSpecial?'더블클릭하여 이름 수정':''}">${esc(nm)}</span>
      <input class="stat-val" value="${esc(data.statVals[i]||'')}" placeholder="-">`;
    const valInp=cell.querySelector('.stat-val');
    valInp.addEventListener('input',()=>{data.statVals[i]=valInp.value;scheduleSave();});
    if(isSpecial){
      const nameSpan=cell.querySelector('.stat-name');
      nameSpan.addEventListener('dblclick',()=>{
        const edit=document.createElement('input');
        edit.className='stat-name-edit';edit.value=data.statNames[i];
        nameSpan.replaceWith(edit);edit.focus();edit.select();
        const commit=()=>{
          const v=edit.value.trim()||'특별능력치';
          data.statNames[i]=v;scheduleSave();renderStats(page,c);
        };
        edit.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();commit();}else if(ev.key==='Escape'){renderStats(page,c);}});
        edit.addEventListener('blur',commit);
      });
    }
    grid.appendChild(cell);
  });
}

/* ---- 특이사항 ---- */
function renderNotes(page,c){
  const data=st(c.id);const box=page.querySelector('[data-notes]');box.innerHTML='';
  if(!data.notes.length){box.innerHTML='<div class="gallery-empty" style="padding:18px">시나리오를 다녀온 뒤 변화한 능력치·소지품 등을 여기에 기록하세요.</div>';return;}
  data.notes.forEach((n)=>{
    const item=document.createElement('div');item.className='note-item';
    if(n._editing){
      item.classList.add('editing');
      item.innerHTML=`
        <button class="del-x" title="삭제">×</button>
        <input class="note-title" placeholder="시나리오명 / 제목" value="${esc(n.title)}">
        <textarea class="inp" placeholder="변화한 능력치, 획득/소실 소지품 등">${esc(n.body)}</textarea>
        <div class="edit-actions"><button class="btn sm primary" data-ndone>✓ 완료</button></div>`;
      item.querySelector('.note-title').addEventListener('input',e=>{n.title=e.target.value;scheduleSave();});
      item.querySelector('textarea').addEventListener('input',e=>{n.body=e.target.value;scheduleSave();});
      item.querySelector('.del-x').addEventListener('click',()=>{
        if(confirm('이 기록을 삭제할까요?')){data.notes=data.notes.filter(x=>x.id!==n.id);renderNotes(page,c);scheduleSave();}
      });
      item.querySelector('[data-ndone]').addEventListener('click',()=>{n._editing=false;renderNotes(page,c);scheduleSave();});
    } else {
      item.classList.add('view');
      item.innerHTML=`
        <div class="nv-title">${n.title?esc(n.title):'<span class="sv-untitled">제목 없음</span>'}</div>
        ${n.body?`<p class="nv-body">${esc(n.body).replace(/\n/g,'<br>')}</p>`:'<p class="nv-body sv-dim">내용 없음</p>'}
        <div class="sv-hint">더블클릭하여 수정</div>`;
      item.addEventListener('dblclick',()=>{n._editing=true;renderNotes(page,c);});
    }
    box.appendChild(item);
  });
}

/* ---- 갤러리 캐러셀 (한 장씩 + 썸네일 드래그 정렬) ---- */
let dragSrc=null,dragData=null;
const galIndex={}; // charId -> 현재 보고있는 인덱스
function clampIndex(c){
  const n=st(c).gallery.length;
  let i=galIndex[c]||0;
  if(i>=n)i=n-1; if(i<0)i=0;
  galIndex[c]=i; return i;
}
function moveGallery(cid,dir){
  const data=st(cid);if(!data.gallery.length)return;
  let i=clampIndex(cid)+dir;
  if(i<0)i=0; if(i>=data.gallery.length)i=data.gallery.length-1;
  galIndex[cid]=i;
  const page=document.getElementById('page-'+cid);
  const c=CHARS.find(x=>x.id===cid);
  renderGallery(page,c);
}
function renderGallery(page,c){
  const data=st(c.id);
  const stage=page.querySelector('[data-stage]');
  const strip=page.querySelector('[data-strip]');
  const navL=page.querySelector('[data-gl]'), navR=page.querySelector('[data-gr]');

  if(!data.gallery.length){
    stage.innerHTML='<div class="gallery-empty" style="width:100%;border:none">갤러리가 비어 있습니다.<br>“+ 사진 추가”로 여러 장을 한 번에 올릴 수 있어요.</div>';
    strip.innerHTML=''; navL.style.display=navR.style.display='none';
    return;
  }
  navL.style.display=navR.style.display='';
  const idx=clampIndex(c.id);
  const cur=data.gallery[idx];

  // 스테이지 (한 장, contain → 세로로 길면 양옆 여백)
  stage.innerHTML=`
    <span class="gcounter">${idx+1} / ${data.gallery.length}</span>
    <button class="gdel" title="이 사진 삭제">×</button>
    <img src="${cur.img}" alt="">`;
  stage.querySelector('img').addEventListener('click',()=>openLightbox(cur.img));
  stage.querySelector('.gdel').addEventListener('click',()=>{
    if(confirm('이 사진을 삭제할까요?')){
      data.gallery=data.gallery.filter(x=>x.id!==cur.id);
      if(galIndex[c.id]>=data.gallery.length)galIndex[c.id]=data.gallery.length-1;
      renderGallery(page,c);scheduleSave();
    }
  });
  navL.disabled=(idx===0);
  navR.disabled=(idx===data.gallery.length-1);

  // 썸네일 스트립 (드래그 정렬 + 클릭 이동)
  strip.innerHTML='';
  data.gallery.forEach((g,i)=>{
    const t=document.createElement('div');
    t.className='gtm'+(i===idx?' current':'');t.draggable=true;t.dataset.gid=g.id;
    t.innerHTML=`<img src="${g.img}"><span class="gtm-num">${i+1}</span>`;
    t.addEventListener('click',()=>{galIndex[c.id]=i;renderGallery(page,c);});
    t.addEventListener('dragstart',()=>{dragSrc=t;dragData=data;t.classList.add('dragging');});
    t.addEventListener('dragend',()=>{t.classList.remove('dragging');strip.querySelectorAll('.gtm').forEach(x=>x.classList.remove('over'));});
    t.addEventListener('dragover',e=>{e.preventDefault();if(dragData!==data)return;if(t!==dragSrc)t.classList.add('over');});
    t.addEventListener('dragleave',()=>t.classList.remove('over'));
    t.addEventListener('drop',e=>{
      e.preventDefault();if(dragData!==data||t===dragSrc)return;
      const from=data.gallery.findIndex(x=>x.id===dragSrc.dataset.gid);
      const to=data.gallery.findIndex(x=>x.id===g.id);
      const[m]=data.gallery.splice(from,1);data.gallery.splice(to,0,m);
      galIndex[c.id]=to; // 옮긴 사진을 따라가서 보여줌
      renderGallery(page,c);scheduleSave();
    });
    strip.appendChild(t);
  });
  // 현재 썸네일이 보이도록 스크롤
  const curThumb=strip.children[idx];
  if(curThumb)curThumb.scrollIntoView({inline:'center',block:'nearest'});
}

/* ---- 라이트박스 ---- */
const lightbox=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg');
function openLightbox(src){lbImg.src=src;lightbox.classList.add('show');}
document.getElementById('lbClose').addEventListener('click',()=>lightbox.classList.remove('show'));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)lightbox.classList.remove('show');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lightbox.classList.remove('show');});

/* ---- 유틸 ---- */
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* =========================================================
   초기화
   ========================================================= */
(async function init(){
  await openDB();
  const saved=await dbGet(KEY);
  if(saved){
    // 병합 (구조 보강)
    STATE.scenarios=(saved.scenarios||[]).map(s=>({...s,_editing:false}));
    CHARS.forEach(c=>{
      const s=saved.chars&&saved.chars[c.id];
      const blank=blankChar();
      if(s){
        STATE.chars[c.id]={
          avatar:s.avatar||null,
          profile:Object.assign(blank.profile,s.profile||{}),
          statNames:(s.statNames&&s.statNames.length===10)?s.statNames:[...BASE_STATS],
          statVals:(s.statVals&&s.statVals.length===10)?s.statVals:Array(10).fill(''),
          notes:(s.notes||[]).map(n=>({...n,_editing:false})),gallery:s.gallery||[]
        };
      }
    });
  }
  buildCharPages();
  renderScenarios();
})();
</script>
